name: Release gate
run-name: "Release gate: ${{ github.event.inputs.release_tag || github.ref_name }}"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "作成予定のリリースタグ（例: v0.1.0）"
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify the pre-tag release gate
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash tools/verify-pre-tag-release-gate.sh "$RELEASE_TAG"
      - name: Validate release target
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          set -eu
          test -n "$RELEASE_TAG"
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            test "$GITHUB_REF" = "refs/heads/main"
          fi
          printf 'MCP_AUTHORIZATION_SERVER_RELEASE_TAG=%s\n' "$RELEASE_TAG" >> "$GITHUB_ENV"
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@4eea0b33e3d1f02ecfe37cf16e7204c424009606 # v3.21.0
      - name: Run automated release gate
        run: nix develop --command cargo make release-gate
